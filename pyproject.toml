[project]
name = "sympai"
version = "0.1.0"
description = "A personal health guide built as a hospital of AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "langchain-groq>=0.3.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=1.10",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
]

# The build system turns src/sympai into an importable package, so scripts
# and tests can say "from sympai.tools import ...". uv sync installs it in
# editable mode, the way an IDE puts your own module on the classpath.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

# uv sync installs both groups by default. The ml group holds SetFit and
# PyTorch for the triage classifier. It is big, so on a machine that should
# not have it, use `uv sync --no-group ml` and SympAI falls back to rules only.
# The voice group holds sounddevice for the microphone, used by chat.py --voice.
[tool.uv]
default-groups = ["dev", "ml", "voice"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
    "pytest>=9.1.1",
]
ml = [
    "setfit>=1.2",
]
voice = [
    "sounddevice>=0.5",
]
